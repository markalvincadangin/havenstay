name: Production VPS Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  validate:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Syntax
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.prod.yml config > /dev/null
          echo "Docker compose configurations validated successfully."

  deploy:
    name: Deploy to Cloud VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.repository_owner != ''
    steps:
      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'ubuntu' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '~/havenstay' }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice ::VPS_HOST or VPS_SSH_KEY secret is not configured. Skipping automated remote SSH deployment."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_rsa "${VPS_USER}@${VPS_HOST}" << 'ENDSSH'
            set -e
            cd ~/havenstay
            echo "Pulling latest changes from Git..."
            git pull origin main || git pull origin master
            echo "Rebuilding and restarting production containers..."
            docker compose -f docker-compose.prod.yml up -d --build
            echo "Running health checks..."
            docker compose -f docker-compose.prod.yml ps
          ENDSSH
